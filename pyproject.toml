[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uctp-paper"
version = "0.1.0"
description = "Institutional course timetabling and student sectioning"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = ["numpy==2.4.6"]

[project.optional-dependencies]
fast = ["numba>=0.68"]
paper = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9"]

[project.scripts]
uctp = "uctp.cli:main"
uctp-generate = "uctp.generation.cli:main"
uctp-experiments = "uctp.experiments.cli:main"

[tool.setuptools.packages.find]
include = ["uctp*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
